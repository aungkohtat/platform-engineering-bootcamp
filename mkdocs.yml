site_name: Platform Engineering Bootcamp
site_description: Building an internal developer platform on Kubernetes, one component at a time.
site_url: https://aungkohtat.github.io/platform-engineering-bootcamp/
repo_url: https://github.com/aungkohtat/platform-engineering-bootcamp
repo_name: aungkohtat/platform-engineering-bootcamp
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Introduction: 00-intro-platform-engineering.md
  - Modules:
      - 00 Kubernetes: modules/00-kubernetes/README.md
      - 01 Cilium: modules/01-cilium/README.md
      - 02 FluxCD: modules/02-fluxcd/README.md
      - 03 GitLab: modules/03-gitlab/README.md
      - 04 Keycloak: modules/04-keycloak/README.md
      - 05 Kyverno: modules/05-kyverno/README.md
      - 06 OpenBao: modules/06-openbao/README.md
      - 07 Falco: modules/07-falco/README.md
      - 08 OpenTelemetry + LGTM: modules/08-otel-lgtm/README.md
      - 09 Backstage: modules/09-backstage/README.md
