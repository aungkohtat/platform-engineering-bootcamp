# helm install cilium cilium/cilium --version 1.20.3 -n kube-system -f manifests/cilium-values.yaml

# Strict kube-proxy replacement (lesson 0003). With no kube-proxy the agent cannot use
# the kubernetes Service to find the API, so it is told the VIP directly. An IP, not
# kyl-vip: the agent starts before CoreDNS and does not read the node's /etc/hosts.
kubeProxyReplacement: true
k8sServiceHost: 192.168.1.10
k8sServicePort: 6443

# Allocate pod CIDRs from kubeadm's podSubnet. Cilium's default pool, 10.0.0.0/8,
# overlaps the VirtualBox NAT network on every VM.
ipam:
  mode: kubernetes

# LAN-facing LoadBalancer IPs (lesson 0004): answer ARP for Service IPs on the LAN.
l2announcements:
  enabled: true
externalIPs:
  enabled: true
# Each announced Service holds a Lease that every node renews; raise the client rate
# limit above the default so the renewals are not throttled.
k8sClientRateLimit:
  qps: 20
  burst: 40

# Envoy Gateway is the Gateway API controller in this lab.
gatewayAPI:
  enabled: false
